  <style>

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: 38px 22px 26px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 20%, #faf4e5, #e9dfce); }
    main { width: min(1120px, 100%); }
    header { margin: 0 5px 24px; display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .eyebrow { color: #a7784c; font-size: 10px; letter-spacing: .3em; font-weight: 650; }
    h1 { margin: 10px 0 9px; font-family: "Songti SC", "SimSun", serif; font-size: clamp(33px, 5.2vw, 52px); font-weight: 500; letter-spacing: .17em; }
    .subtitle { margin: 0; color: #918372; font-size: 12px; letter-spacing: .08em; line-height: 1.8; }
    .seal { width: 51px; height: 65px; display: grid; place-content: center; border: 2px solid #a84e3b; outline: 1px solid #a84e3b; outline-offset: -6px; border-radius: 3px; color: #a84e3b; font-family: "Songti SC", "SimSun", serif; font-size: 19px; line-height: 1.3; text-align: center; transform: rotate(5deg); flex-shrink: 0; }
    .stage { overflow: hidden; border: 1px solid #bca98d; border-radius: 12px; background: #d4bb93; box-shadow: 0 22px 60px #5841241c; }
    .scene { display: block; width: 100%; height: auto; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 19px 24px; border-top: 1px solid #c6b393; background: #f8f0df; }
    .line { margin: 0; font-family: "Songti SC", "SimSun", serif; font-size: 17px; letter-spacing: .12em; }
    .line small { display: block; color: #92816a; margin-top: 5px; font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .08em; }
    .controls { display: flex; gap: 8px; flex-shrink: 0; }
    button { font: inherit; font-size: 12px; border: 1px solid #b5a084; border-radius: 5px; padding: 10px 15px; color: #68543f; background: transparent; cursor: pointer; transition: background .18s; }
    button:first-child { background: #984937; color: #fff0d4; border-color: #984937; }
    button:hover { background: #e7d6ba; }
    button:first-child:hover { background: #7e3b2e; }
    button:focus-visible { outline: 2px solid #987440; outline-offset: 4px; }
    footer { margin: 18px 5px 0; display: flex; justify-content: space-between; gap: 16px; color: #9c8a72; font-size: 9px; letter-spacing: .16em; }
    noscript p { text-align: center; font-size: 12px; padding: 12px; color: #745d40; }
    @media (max-width: 600px) {
      body { padding: 25px 12px 18px; }
      header { margin-bottom: 19px; }
      .eyebrow { font-size: 8px; letter-spacing: .2em; }
      .subtitle { font-size: 10px; }
      .seal { width: 42px; height: 56px; font-size: 16px; }
      .toolbar { padding: 15px; flex-wrap: wrap; gap: 15px; }
      .controls { margin-left: auto; }
      .line { font-size: 15px; }
      button { padding: 9px 13px; font-size: 11px; }
      footer { font-size: 8px; letter-spacing: .06em; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>

      <div class="toolbar">
        <p class="line" id="caption">柱子：这班，非上不可。<small>历史梗趣味演绎 · 两个人的圆周运动</small></p>
        <div class="controls">
          <button id="play-button" type="button" aria-pressed="false">暂停追逐</button>
          <button id="speed-button" type="button" aria-pressed="false">正常 ×1</button>
        </div>
      </div>
      <noscript><p>启用 JavaScript 后，小剧场即可开始播放。</p></noscript>
    </section>
    <footer><span>A VERY BUSY PILLAR.</span><span>身法可以绕，班还是得上。</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const NS = 'http://www.w3.org/2000/svg';
      const byId = id => document.getElementById(id);
      const behind = byId('behind-pillar');
      const ahead = byId('in-front-of-pillar');
      const playButton = byId('play-button');
      const speedButton = byId('speed-button');
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !preference.matches;
      let speed = 1;
      let time = 0;
      let previous = null;
      let frame = null;
      const TAU = Math.PI * 2;

      function element(tag, attributes = {}) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      }

      function createActor(templateId, phase, label, color) {
        const root = element('g');
        const facing = element('g');
        const pose = element('g');
        const artwork = byId(templateId).cloneNode(true);
        artwork.removeAttribute('id');
        pose.appendChild(artwork);
        facing.appendChild(pose);
        root.appendChild(facing);
        const name = element('text', { x: 0, y: 28, 'text-anchor': 'middle', fill: color, 'font-size': 14, 'font-family': "'Songti SC', 'SimSun', serif", 'letter-spacing': 3 });
        name.textContent = label;
        root.appendChild(name);
        ahead.appendChild(root);
        const shadow = element('ellipse', { rx: 39, ry: 10 });
        byId('shadows').appendChild(shadow);
        return { root, facing, pose, artwork, shadow, phase, depth: 0,
          frontLeg: artwork.querySelector('.leg-front'),
          backLeg: artwork.querySelector('.leg-back'),
          frontArm: artwork.querySelector('.arm-front'),
          backArm: artwork.querySelector('.back-arm'),
          coat: artwork.querySelector('.coat-tail'),
          beads: artwork.querySelector('.crown-beads'),
          beard: artwork.querySelector('.beard'),
          headTie: artwork.querySelector('.head-tie'),
          sword: artwork.querySelector('.sword'),
          sweat: artwork.querySelector('.sweat'),
          isKing: templateId === 'king-art' };
      }

      const actors = [
        createActor('king-art', .38, '秦王', '#635333'),
        createActor('jingke-art', .38 - 1.75, '荆轲', '#4c7568')
      ];
      const dust = Array.from({ length: 12 }, () => {
        const puff = element('ellipse', { rx: 8, ry: 3 });
        byId('dust-layer').appendChild(puff);
        return puff;
      });

      function poseActor(actor, t) {
        const angle = t * TAU / 7.4 + actor.phase;
        const depth = Math.sin(angle);
        const x = 560 + Math.cos(angle) * 266;
        const y = 489 + depth * 97;
        const scale = .8 + (depth + 1) * .115;
        // The horizontal tangent changes smoothly at each end of the ellipse.
        const tangent = -Math.sin(angle);
        const facing = Math.tanh(tangent * 4.5);
        const stride = t * TAU / .47 + actor.phase * 2;
        const kick = Math.sin(stride) * 35;
        const bob = -Math.abs(Math.sin(stride)) * 6;
        const lean = 8 + Math.sin(stride * 2) * 1.4;
        actor.depth = depth;
        actor.root.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${scale.toFixed(3)})`);
        actor.facing.setAttribute('transform', `scale(${facing.toFixed(3)} 1)`);
        actor.pose.setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(${lean.toFixed(2)} 0 -75)`);
        const legHeight = actor.isKing ? -49 : -47;
        actor.frontLeg.setAttribute('transform', `translate(${actor.isKing ? 12 : 11} ${legHeight}) rotate(${kick})`);
        actor.backLeg.setAttribute('transform', `translate(-10 ${legHeight}) rotate(${-kick})`);
        actor.frontArm.setAttribute('transform', `translate(${actor.isKing ? 22 : 21} ${actor.isKing ? -127 : -126}) rotate(${actor.isKing ? -kick * .7 : Math.sin(stride) * 12})`);
        actor.backArm.setAttribute('transform', `translate(${actor.isKing ? 8 : -15} ${actor.isKing ? -127 : -126}) rotate(${kick * .8})`);
        actor.coat.setAttribute('transform', `translate(${actor.isKing ? -17 : -18} ${actor.isKing ? -86 : -83}) rotate(${Math.sin(t * 13 + actor.phase) * 8})`);
        if (actor.beads) actor.beads.setAttribute('transform', `translate(26 -215) rotate(${Math.sin(stride) * 12})`);
        if (actor.beard) actor.beard.setAttribute('transform', `translate(8 -150) rotate(${-8 + Math.sin(stride) * 11})`);
        if (actor.headTie) actor.headTie.setAttribute('transform', `translate(-20 -189) rotate(${Math.sin(stride + 1) * 12})`);
        if (actor.sword) actor.sword.setAttribute('transform', `translate(-26 -111) rotate(${-19 + Math.sin(stride) * 6})`);
        if (actor.sweat) actor.sweat.setAttribute('opacity', .5 + Math.sin(t * 8) * .4);
        actor.shadow.setAttribute('cx', x.toFixed(2));
        actor.shadow.setAttribute('cy', (y + 1).toFixed(2));
        actor.shadow.setAttribute('rx', (39 * scale).toFixed(2));
        actor.shadow.setAttribute('ry', (10 * scale).toFixed(2));
        actor.shadow.setAttribute('opacity', (.65 + depth * .15).toFixed(2));

        const layer = depth < 0 ? behind : ahead;
        if (actor.root.parentNode !== layer) layer.appendChild(actor.root);
        return { x, y, tangent, scale };
      }

      function render(t) {
        const positions = actors.map(actor => poseActor(actor, t));
        // Sort the actual SVG elements by depth, including when both share a layer.
        for (const layer of [behind, ahead]) {
          const members = actors.filter(actor => actor.root.parentNode === layer).sort((a, b) => a.depth - b.depth);
          members.forEach(actor => layer.appendChild(actor.root));
        }
        dust.forEach((puff, index) => {
          const actorIndex = index % 2;
          const position = positions[actorIndex];
          const life = (t * 2.1 + index / 6) % 1;
          const direction = Math.sign(position.tangent) || 1;
          puff.setAttribute('cx', position.x - direction * (life * 43 + 10));
          puff.setAttribute('cy', position.y + 5 - Math.sin(life * Math.PI) * 8);
          puff.setAttribute('rx', 3 + life * 10);
          puff.setAttribute('ry', 2 + life * 3);
          puff.setAttribute('opacity', Math.sin(life * Math.PI) * .42);
        });
        const excitement = Math.max(0, Math.sin(t * 2.7));
        byId('advice').setAttribute('transform', `translate(881 ${233 - excitement * 3}) rotate(${Math.sin(t * 2.7) * 1.3})`);
      }

      function animate(timestamp) {
        frame = null;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((timestamp - previous) / 1000, .05) * speed;
        previous = timestamp;
        render(time);
        frame = requestAnimationFrame(animate);
      }

      function synchronize() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        playButton.textContent = playing ? '暂停追逐' : '继续绕柱';
        playButton.setAttribute('aria-pressed', String(!playing));
        speedButton.textContent = speed === 1 ? '正常 ×1' : '加急 ×1.7';
        speedButton.setAttribute('aria-pressed', String(speed !== 1));
        if (playing && !document.hidden) frame = requestAnimationFrame(animate);
      }

      playButton.addEventListener('click', () => { playing = !playing; synchronize(); });
      speedButton.addEventListener('click', () => { speed = speed === 1 ? 1.7 : 1; synchronize(); });
      preference.addEventListener('change', event => { playing = !event.matches; synchronize(); });
      document.addEventListener('visibilitychange', synchronize);
      render(0);
      synchronize();
    })();
  </script>
</body>
</html>
